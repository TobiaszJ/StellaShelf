[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stellashelf"
version = "0.5.0"
description = "Astrophotography Digital Asset Manager & Processing Hub"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "Tobiasz Keller" },
]
dependencies = [
    "astropy>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "rich>=13.7",
    "click>=8.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]
raw = [
    "rawpy>=0.21",
]

[project.scripts]
stellashelf = "stellashelf.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["N806"]  # SQLAlchemy convention uses SessionLocal (uppercase L)

[tool.ruff.lint.per-file-ignores]
"src/stellashelf/db.py" = ["E501"]  # SQL trigger strings are unavoidably long
"src/stellashelf/importer.py" = ["E501"]  # SQL strings
"src/stellashelf/api.py" = ["E501"]  # SQL strings in merge endpoint
"tests/*.py" = ["E501"]  # Test data lines

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require local astro data",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true